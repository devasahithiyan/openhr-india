name: Foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openhr
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: openhr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openhr -d openhr_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://openhr:ci_test_only@localhost:5432/openhr_test
      TEST_DATABASE_URL: postgresql://openhr:ci_test_only@localhost:5432/openhr_test
      APP_ORIGIN: http://localhost:3000
      DEMO_SEED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:env
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Prototype still builds independently
        run: pnpm --dir prototype install --frozen-lockfile --ignore-workspace && pnpm --dir prototype build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
